name: android

on:
  push:
    branches: ["*"]
  pull_request:

env:
  NDK_VERSION: "27.3.13750724"

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      # -------------------------
      # Install base tools
      # -------------------------
      - name: Install dependencies
        run: |
          brew update
          brew install cmake

      # -------------------------
      # Set Vulkan environment
      # -------------------------
      - name: Set Vulkan env
        run: |
          curl -L -O https://sdk.lunarg.com/sdk/download/1.4.341.1/mac/vulkansdk-macos-1.4.341.1.zip
          unzip vulkansdk-macos-1.4.341.1.zip
          sudo "$(pwd)/vulkansdk-macOS-1.4.341.1.app/Contents/MacOS/vulkansdk-macOS-1.4.341.1" \
            --root ~/VulkanSDK/1.4.341.1 \
            --accept-licenses --default-answer --confirm-command install com.lunarg.vulkan.core com.lunarg.vulkan.usr com.lunarg.vulkan.sdl2 com.lunarg.vulkan.glm com.lunarg.vulkan.volk com.lunarg.vulkan.vma com.lunarg.vulkan.ios
          cd ~/VulkanSDK/1.4.341.1 && ls -l


      # -------------------------
      # Verify Vulkan tools
      # -------------------------
      - name: Check Vulkan tools
        run: |
          echo "VULKAN_SDK=$VULKAN_SDK"
          which glslc || true
          glslc --version || true

      # -------------------------
      # Android SDK + NDK
      # The legacy "tools" package was removed from Google's SDK repository,
      # so the action's default `packages` no longer resolves. Install only
      # what the build needs. The action accepts the SDK licenses itself.
      # -------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools ndk;${{ env.NDK_VERSION }}"

      # -------------------------
      # Environment setup
      # scripts/run.sh reads ANDROID_NDK_ROOT.
      # -------------------------
      - name: Set environment variables
        run: |
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> $GITHUB_ENV

      - name: Build Android arm64-v8a
        run: ./scripts/run.sh -t arm64-v8a
